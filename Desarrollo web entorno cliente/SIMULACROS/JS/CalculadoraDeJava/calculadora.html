<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Calculadora JavaScript</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4">
      <h1 class="text-center mb-4">Calculadora</h1>

      <!-- Panel superior -->
      <div class="text-center mb-4">
        <button id="btnCientifica" class="btn btn-primary">
          Mostrar / Ocultar científica
        </button>

        <button id="btnHistorial" class="btn btn-secondary">
          Mostrar / Ocultar historial
        </button>
      </div>

      <div class="row">
        <!-- Calculadora -->
        <div class="col-6">
          <input
            type="text"
            id="pantalla"
            class="form-control mb-3 text-end"
            readonly
          />

          <div class="mb-2">
            <button class="btn btn-dark" onclick="agregarNumero('7')">7</button>
            <button class="btn btn-dark" onclick="agregarNumero('8')">8</button>
            <button class="btn btn-dark" onclick="agregarNumero('9')">9</button>
            <button class="btn btn-warning" onclick="agregarNumero('+')">
              +
            </button>
          </div>

          <div class="mb-2">
            <button class="btn btn-dark" onclick="agregarNumero('4')">4</button>
            <button class="btn btn-dark" onclick="agregarNumero('5')">5</button>
            <button class="btn btn-dark" onclick="agregarNumero('6')">6</button>
            <button class="btn btn-warning" onclick="agregarNumero('-')">
              -
            </button>
          </div>

          <div class="mb-2">
            <button class="btn btn-dark" onclick="agregarNumero('1')">1</button>
            <button class="btn btn-dark" onclick="agregarNumero('2')">2</button>
            <button class="btn btn-dark" onclick="agregarNumero('3')">3</button>
            <button class="btn btn-warning" onclick="agregarNumero('*')">
              *
            </button>
          </div>

          <div class="mb-2">
            <button class="btn btn-dark" onclick="agregarNumero('0')">0</button>
            <button class="btn btn-dark" onclick="agregarNumero('.')">.</button>
            <button class="btn btn-success" onclick="calcular()">=</button>
            <button class="btn btn-warning" onclick="agregarNumero('/')">
              /
            </button>
          </div>

          <button class="btn btn-danger mt-2" onclick="borrar()">Borrar</button>

          <!-- Panel científico oculto -->
          <div id="panelCientifico" class="mt-4 d-none">
            <h3>Calculadora científica</h3>

            <button class="btn btn-info" onclick="operacionCientifica('log')">
              log
            </button>

            <button class="btn btn-info" onclick="operacionCientifica('sin')">
              sin
            </button>

            <button class="btn btn-info" onclick="operacionCientifica('cos')">
              cos
            </button>

            <button class="btn btn-info" onclick="operacionCientifica('tan')">
              tan
            </button>
          </div>
        </div>

        <!-- Historial oculto -->
        <div id="panelHistorial" class="col-6 d-none">
          <h3>Historial</h3>

          <textarea
            id="historial"
            class="form-control"
            rows="15"
            disabled
          ></textarea>
        </div>
      </div>
    </div>

    <script>
      const pantalla = document.querySelector("#pantalla");
      const historial = document.querySelector("#historial");

      const btnCientifica = document.querySelector("#btnCientifica");
      const btnHistorial = document.querySelector("#btnHistorial");

      const panelCientifico = document.querySelector("#panelCientifico");
      const panelHistorial = document.querySelector("#panelHistorial");

      btnCientifica.addEventListener("click", () => {
        panelCientifico.classList.toggle("d-none");
      });

      btnHistorial.addEventListener("click", () => {
        panelHistorial.classList.toggle("d-none");
      });

      function agregarNumero(valor) {
        pantalla.value += valor;
      }

      function borrar() {
        pantalla.value = "";
      }

      function calcular() {
        const operacion = pantalla.value;

        const total = eval(operacion);

        pantalla.value = total;

        historial.value += `${operacion} = ${total}\n`;
      }

      function operacionCientifica(tipo) {
        const numero = Number(pantalla.value);

        let total = 0;

        if (tipo == "log") {
          total = Math.log10(numero);
        } else if (tipo == "sin") {
          total = Math.sin(numero);
        } else if (tipo == "cos") {
          total = Math.cos(numero);
        } else if (tipo == "tan") {
          total = Math.tan(numero);
        }

        historial.value += `${tipo}(${numero}) = ${total}\n`;

        pantalla.value = total;
      }
    </script>
  </body>
</html>
