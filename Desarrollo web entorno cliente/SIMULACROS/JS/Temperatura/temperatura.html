<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Conversor Temperatura</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <h1>Conversor de Temperatura</h1>

      <div class="mb-3">
        <label>Celsius</label>
        <input type="number" id="celsius" class="form-control" />
        <button id="btnCtoF" class="btn btn-primary mt-2">
          Convertir a Fahrenheit
        </button>
      </div>

      <div class="mb-3">
        <label>Fahrenheit</label>
        <input type="number" id="fahrenheit" class="form-control" />
        <button id="btnFtoC" class="btn btn-success mt-2">
          Convertir a Celsius
        </button>
      </div>

      <h3 id="resultado"></h3>
    </div>

    <script>
      let inputCelsius = document.querySelector("#celsius");
      let inputFahrenheit = document.querySelector("#fahrenheit");
      let btnCtoF = document.querySelector("#btnCtoF");
      let btnFtoC = document.querySelector("#btnFtoC");
      let resultado = document.querySelector("#resultado");

      btnCtoF.addEventListener("click", () => {
        let c = parseFloat(inputCelsius.value);

        if (isNaN(c)) {
          alert("Introduce un valor en Celsius");
        } else {
          let f = (c * 9) / 5 + 32;
          resultado.textContent = `cºC = ${f.toFixed(2)}ºF`;
        }
      });

      btnFtoC.addEventListener("click", () => {
        let f = parseFloat(inputFahrenheit.value);

        if (isNaN(f)) {
          alert("Introduce un valor en Fahrenheit");
        } else {
          let c = ((f - 32) * 5) / 9;
          resultado.textContent = `fºF = ${c.toFixed(2)}ºC`;
        }
      });
    </script>
  </body>
</html>
