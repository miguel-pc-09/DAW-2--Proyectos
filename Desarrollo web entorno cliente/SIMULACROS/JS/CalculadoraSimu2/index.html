<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container mt-4">
      <div class="row mt-4">
        <div class="col-4">
          <h3>Listado</h3>
          <ul class="list-group" id="listaOperaciones"></ul>
        </div>
        <div class="col-4">
          <h3>Calculadora</h3>
          <input
            type="number"
            class="form-control mt-3"
            id="numero1"
            placeholder="Introduce tu primer numero"
          />
          <input
            type="number"
            class="form-control mt-3"
            id="numero2"
            placeholder="Introduce tu segundo numero"
          />
          <div class="mt-3">
            <button class="btn btn-primary" id="suma">Suma</button>
            <button class="btn btn-secondary" id="resta">Resta</button>
            <button class="btn btn-danger" id="multiplicacion">
              Multiplicacion
            </button>
            <button class="btn btn-warning" id="division">Division</button>
          </div>
          <div>
            <h2 class="mt-4">Resultado: <span id="resultado">0</span></h2>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
