<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Menú Diario</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4">
      <h1>Menú diario</h1>

      <div class="mb-3">
        <label class="form-label">Nombre del alimento</label>

        <input
          type="text"
          id="nombre"
          class="form-control"
          placeholder="Ejemplo: Manzana"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Calorías</label>

        <input
          type="number"
          id="calorias"
          class="form-control"
          placeholder="Ejemplo: 52"
        />
      </div>

      <button id="btnAgregar" class="btn btn-primary">Añadir al menú</button>

      <h2 id="total" class="mt-4">Calorías Totales: 0</h2>

      <ul id="lista" class="list-group mt-3"></ul>
    </div>

    <script>
      // Referencias HTML
      const inputNombre = document.getElementById("nombre");

      const inputCalorias = document.getElementById("calorias");

      const botonAgregar = document.getElementById("btnAgregar");

      const lista = document.getElementById("lista");

      const totalHTML = document.getElementById("total");

      // Variable para guardar el total
      let totalCalorias = 0;

      // Evento click del botón
      botonAgregar.addEventListener("click", () => {
        // Guardamos valores
        const nombre = inputNombre.value;

        const calorias = Number(inputCalorias.value);

        // Validación
        if (nombre == "" || calorias <= 0) {
          alert("Rellena los campos correctamente");
        } else {
          // Creamos el li
          const elementoLista = document.createElement("li");

          elementoLista.className =
            "list-group-item d-flex justify-content-between align-items-center";

          // Texto del alimento
          const texto = document.createElement("span");

          texto.textContent = nombre + " - " + calorias + " kcal";

          // Botón eliminar
          const botonEliminar = document.createElement("button");

          botonEliminar.textContent = "Eliminar";

          botonEliminar.className = "btn btn-danger btn-sm";

          // Evento eliminar
          botonEliminar.addEventListener("click", () => {
            // Restamos calorías
            totalCalorias = totalCalorias - calorias;

            // Actualizamos total
            totalHTML.textContent = "Calorías Totales: " + totalCalorias;

            // Quitamos color rojo si baja
            if (totalCalorias <= 2000) {
              totalHTML.classList.remove("text-danger");
            }

            // Eliminamos nodo
            elementoLista.remove();
          });

          // Añadimos elementos al li
          elementoLista.appendChild(texto);

          elementoLista.appendChild(botonEliminar);

          // Añadimos li a la lista
          lista.appendChild(elementoLista);

          // Sumamos calorías
          totalCalorias = totalCalorias + calorias;

          // Actualizamos total
          totalHTML.textContent = "Calorías Totales: " + totalCalorias;

          // Si supera 2000 se pone rojo
          if (totalCalorias > 2000) {
            totalHTML.classList.add("text-danger");
          }

          // Limpiamos inputs
          inputNombre.value = "";

          inputCalorias.value = "";
        }
      });
    </script>
  </body>
</html>
