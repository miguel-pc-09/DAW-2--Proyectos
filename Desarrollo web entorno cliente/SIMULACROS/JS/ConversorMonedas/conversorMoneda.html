<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Conversor de Monedas</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-5">Conversor de Monedas</h1>

      <div class="row">
        <!-- Historial izquierda -->
        <div class="col-6">
          <h2>Historial</h2>

          <ul id="historial" class="list-group"></ul>
        </div>

        <!-- Conversor derecha -->
        <div class="col-6">
          <h2>Conversor</h2>

          <input
            type="number"
            id="cantidad"
            class="form-control mb-3"
            placeholder="Introduce cantidad"
          />

          <button id="btnEuroDolar" class="btn btn-primary mb-3">
            Euro → Dólar
          </button>

          <button id="btnDolarEuro" class="btn btn-success mb-3">
            Dólar → Euro
          </button>

          <h3 id="resultado" class="mt-3"></h3>
        </div>
      </div>
    </div>

    <script>
      const cantidad = document.querySelector("#cantidad");

      const btnEuroDolar = document.querySelector("#btnEuroDolar");

      const btnDolarEuro = document.querySelector("#btnDolarEuro");

      const resultado = document.querySelector("#resultado");

      const historial = document.querySelector("#historial");

      // Conversión fija simple
      const cambioEuroDolar = 1.09;

      // Euro a dólar
      btnEuroDolar.addEventListener("click", () => {
        const euros = Number(cantidad.value);

        const dolares = euros * cambioEuroDolar;

        resultado.textContent = `${euros}€ son ${dolares.toFixed(2)}$`;

        const nuevoRegistro = document.createElement("li");

        nuevoRegistro.classList.add("list-group-item");

        nuevoRegistro.textContent = `${euros}€ → ${dolares.toFixed(2)}$`;

        historial.prepend(nuevoRegistro);

        cantidad.value = "";
      });

      // Dólar a euro
      btnDolarEuro.addEventListener("click", () => {
        const dolares = Number(cantidad.value);

        const euros = dolares / cambioEuroDolar;

        resultado.textContent = `${dolares}$ son ${euros.toFixed(2)}€`;

        const nuevoRegistro = document.createElement("li");

        nuevoRegistro.classList.add("list-group-item");

        nuevoRegistro.textContent = `${dolares}$ → ${euros.toFixed(2)}€`;

        historial.prepend(nuevoRegistro);

        cantidad.value = "";
      });
    </script>
  </body>
</html>
