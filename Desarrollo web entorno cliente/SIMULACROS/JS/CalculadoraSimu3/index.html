<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container mt-4">
      <div class="row">
        <div class="col">
          <h2>Calculadora</h2>
          <input
            type="number"
            id="numero1"
            class="form-control mb-3"
            placeholder="Introduce el primer numero"
          />
          <input
            type="number"
            id="numero2"
            class="form-control"
            placeholder="Introduce el segundo numero"
          />
          <div class="mt-3 mb-3">
            <button class="btn btn-primary" id="btnSuma">Suma</button>
            <button class="btn btn-secondary" id="btnResta">Resta</button>
            <button class="btn btn-danger" id="btnMulti">Multiplicacion</button>
            <button class="btn btn-warning" id="btnDivi">Division</button>
          </div>
          <h2>Resultado: <span id="resultado" class="mt-3">0</span></h2>
        </div>
        <div class="col">
          <h2>Listado</h2>
          <ul class="list-group mb-3" id="listado"></ul>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
