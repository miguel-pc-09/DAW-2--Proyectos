<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <title>Calculadora</title>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center">Calculadora</h1>
      <div class="row">
        <div class="col-6">
          <h3>Gastos</h3>
          <input
            type="number"
            id="alojamiento"
            class="form-control mb-3"
            placeholder="Gastos de alojamiento"
          />
          <input
            type="number"
            id="alimentacion"
            class="form-control mb-3"
            placeholder="Gastos de alimentación"
          />
          <input
            type="number"
            id="entrenamiento"
            class="form-control mb-3"
            placeholder="Gastos de entrenamiento"
          />
          <button id="btnCalcular" class="btn btn-primary">
            Calcular Total:
          </button>
          <h4 id="resultado" class="mt-4"></h4>
        </div>
        <div class="col-6">
          <h3 class="text-center">Historial</h3>
          <ul id="historial" class="list-group"></ul>
        </div>
      </div>
    </div>
    <script>
      const alojamiento = document.querySelector("#alojamiento");
      const alimentacion = document.querySelector("#alimentacion");
      const entrenamiento = document.querySelector("#entrenamiento");
      const btnCalcular = document.querySelector("#btnCalcular");
      const resultado = document.querySelector("#resultado");
      const historial = document.querySelector("#historial");

      btnCalcular.addEventListener("click", () => {
        const total =
          Number(alojamiento.value) +
          Number(alimentacion.value) +
          Number(entrenamiento.value);
        resultado.textContent = `Total: ${total}`;

        const nuevoRegistro = document.createElement("li");
        nuevoRegistro.classList.add("list-group-item");
        nuevoRegistro.textContent = `Alojamiento: ${alojamiento.value}, Alimentación: ${alimentacion.value}, Entrenamiento: ${entrenamiento.value}, Total: ${total}`;
        historial.append(nuevoRegistro);

        alojamiento.value = "";
        alimentacion.value = "";
        entrenamiento.value = "";
      });
    </script>
  </body>
</html>
