<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Twitter</title>
  </head>

  <body>
    <div class="container">
      <h1 class="text-center">Twitter</h1>

      <div class="row">
        <div class="col-5">
          <h2>Escribe tu twuit</h2>

          <textarea
            id="mensaje"
            class="form-control"
            maxlength="280"
          ></textarea>

          <div id="contador" class="form-control">0/280</div>

          <button id="publicar" class="btn btn-primary mt-3">Publicar</button>
        </div>

        <div class="col-7">
          <h2>Timeline</h2>

          <input
            type="text"
            id="buscador"
            class="form-control mb-3"
            placeholder="Buscar post..."
          />

          <select id="ordenar" class="form-control mb-3">
            <option value="recientes">Más recientes</option>
            <option value="likes">Más likes</option>
          </select>

          <div id="timeline"></div>
        </div>
      </div>
    </div>

    <script>
      let mensajeInput = document.querySelector("#mensaje");
      let contador = document.querySelector("#contador");
      let btnPublicar = document.querySelector("#publicar");
      let timeline = document.querySelector("#timeline");
      let buscador = document.querySelector("#buscador");
      let ordenar = document.querySelector("#ordenar");

      let posts = JSON.parse(localStorage.getItem("posts")) || [];

      mensajeInput.addEventListener("input", () => {
        contador.textContent = `${mensajeInput.value.length}/280`;
      });

      btnPublicar.addEventListener("click", () => {
        let texto = mensajeInput.value.trim();

        if (texto === "") {
          Swal.fire({
            icon: "error",
            title: "Campo vacío",
            text: "No puedes publicar un post vacío",
          });

          return;
        }

        let post = {
          id: Date.now(),
          texto: texto,
          fecha: new Date().toLocaleString(),
          likes: 0,
        };

        posts.unshift(post);

        localStorage.setItem("posts", JSON.stringify(posts));

        mensajeInput.value = "";
        contador.textContent = "0/280";

        pintarPosts();
      });

      buscador.addEventListener("input", () => {
        pintarPosts();
      });

      ordenar.addEventListener("change", () => {
        pintarPosts();
      });

      function pintarPosts() {
        timeline.innerHTML = "";

        let textoBuscado = buscador.value.toLowerCase();

        let postsFiltrados = posts.filter((post) => {
          return post.texto.toLowerCase().includes(textoBuscado);
        });

        if (ordenar.value === "recientes") {
          postsFiltrados.sort((a, b) => {
            return b.id - a.id;
          });
        } else if (ordenar.value === "likes") {
          postsFiltrados.sort((a, b) => {
            return b.likes - a.likes;
          });
        }

        postsFiltrados.forEach((post) => {
          let card = document.createElement("div");

          card.classList.add("card", "mb-3");

          card.innerHTML = `
            <div class="card-body">
              <p class="card-text">${post.texto}</p>

              <small class="text-muted">${post.fecha}</small>

              <div class="mt-3">
                <button class="btn btn-success btnLike">
                  Like (${post.likes})
                </button>

                <button class="btn btn-danger btnBorrar">
                  Borrar
                </button>
              </div>
            </div>
          `;

          let btnLike = card.querySelector(".btnLike");
          let btnBorrar = card.querySelector(".btnBorrar");

          btnLike.addEventListener("click", () => {
            post.likes++;

            localStorage.setItem("posts", JSON.stringify(posts));

            pintarPosts();
          });

          btnBorrar.addEventListener("click", () => {
            posts = posts.filter((elemento) => {
              return elemento.id !== post.id;
            });

            localStorage.setItem("posts", JSON.stringify(posts));

            pintarPosts();
          });

          timeline.append(card);
        });
      }

      pintarPosts();
    </script>
  </body>
</html>
