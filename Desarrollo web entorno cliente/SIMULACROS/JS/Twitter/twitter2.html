<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio JS</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body>
    <div class="container">
      <h1>TWITTER</h1>

      <div class="row justify-content-around">
        <div class="col-5">
          <h2>Escribe tu tuit</h2>

          <input type="text" id="titulo" class="form-control mb-3" />

          <textarea
            id="mensaje"
            class="form-control mb-3"
            maxlength="255"
          ></textarea>

          <div id="contador" class="form-text mb-3">0/255</div>

          <button id="enviar" class="btn btn-primary">Twittear</button>
        </div>

        <div class="col-5">
          <h2>Publicaciones</h2>
          <div id="historial"></div>
        </div>
      </div>
    </div>

    <script>
      let tituloInput = document.querySelector("#titulo");
      let mensajeInput = document.querySelector("#mensaje");
      let contador = document.querySelector("#contador");
      let btnEnviar = document.querySelector("#enviar");
      let historial = document.querySelector("#historial");

      mensajeInput.addEventListener("input", () => {
        contador.textContent = `${mensajeInput.value.length}/255`;
      });

      btnEnviar.addEventListener("click", () => {
        let titulo = tituloInput.value.trim();
        let mensaje = mensajeInput.value.trim();

        if (titulo == "" || mensaje == "") {
          Swal.fire({
            icon: "error",
            title: "Campos vacios",
            text: "No puedes dejar ninguno de los campos vacios",
          });
        } else {
          let card = document.createElement("div");

          card.innerHTML = `
          <div class="card mb-3">
            <div class="card-body">
              <h5 class="card-title">${titulo}</h5>
              <p class="card-text">${mensaje}</p>
            </div>
          </div>`;

          historial.prepend(card);

          mensajeInput.value = "";
          tituloInput.value = "";
          contador.textContent = "0/255";
        }
      });
    </script>
  </body>
</html>
