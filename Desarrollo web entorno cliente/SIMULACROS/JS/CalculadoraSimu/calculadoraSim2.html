<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <title>Calculadora</title>
  </head>

  <body>
    <div class="container mt-3">
      <h1 class="text-center">Calculadora</h1>

      <div class="row mt-4">
        <!-- Parte izquierda: historial -->
        <div class="col-4">
          <h3>Operaciones realizadas</h3>
          <ul id="listaOperaciones" class="list-group"></ul>
        </div>

        <!-- Parte derecha: calculadora -->
        <div class="col-8">
          <input
            type="number"
            class="form-control mt-3"
            id="numero1"
            placeholder="Introduce tu primer numero"
          />

          <input
            type="number"
            id="numero2"
            class="form-control mt-3"
            placeholder="Introduce tu segundo numero"
          />

          <div class="mt-3">
            <button class="btn btn-primary" id="suma">Suma</button>
            <button class="btn btn-secondary" id="resta">Resta</button>
            <button class="btn btn-danger" id="multiplica">
              Multiplicacion
            </button>
            <button class="btn btn-success" id="division">Division</button>
          </div>

          <h2 class="mt-4">Resultado: <span id="resultado">0</span></h2>
        </div>
      </div>
    </div>

    <script>
      const numero1 = document.querySelector("#numero1");
      const numero2 = document.querySelector("#numero2");

      const botonSuma = document.querySelector("#suma");
      const botonResta = document.querySelector("#resta");
      const botonMultiplicacion = document.querySelector("#multiplica");
      const botonDivision = document.querySelector("#division");

      const resultado = document.querySelector("#resultado");
      const listaOperaciones = document.querySelector("#listaOperaciones");

      function calcular(operacion) {
        const n1 = Number(numero1.value);
        const n2 = Number(numero2.value);

        let total = 0;
        let simbolo = "";

        if (operacion === "suma") {
          total = n1 + n2;
          simbolo = "+";
        } else if (operacion === "resta") {
          total = n1 - n2;
          simbolo = "-";
        } else if (operacion === "multiplicacion") {
          total = n1 * n2;
          simbolo = "*";
        } else if (operacion === "division") {
          if (n2 === 0) {
            resultado.textContent = "No se puede dividir entre 0";
            return;
          }

          total = n1 / n2;
          simbolo = "/";
        }

        resultado.textContent = total;

        const li = document.createElement("li");
        li.classList.add("list-group-item");
        li.textContent = `${n1} ${simbolo} ${n2} = ${total}`;

        listaOperaciones.append(li);
      }

      botonSuma.addEventListener("click", () => {
        calcular("suma");
      });

      botonResta.addEventListener("click", () => {
        calcular("resta");
      });

      botonMultiplicacion.addEventListener("click", () => {
        calcular("multiplicacion");
      });

      botonDivision.addEventListener("click", () => {
        calcular("division");
      });
    </script>
  </body>
</html>
