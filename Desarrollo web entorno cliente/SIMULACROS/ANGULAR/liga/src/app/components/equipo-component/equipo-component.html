<div class="container">
  <div class="row row-cols-1 row-cols-md-3 g-4">
    @for (item of equipos; track item.idTeam) {
      <div class="col">
        <div class="card">
          <img [src]="item.strBadge" class="card-img-top" alt="..." />
          <div class="card-body">
            <h5 class="card-title">{{ item.strTeam }}</h5>
          </div>
        </div>
      </div>
    }
  </div>
</div>
