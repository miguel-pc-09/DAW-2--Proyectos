<div class="container mt-4">
  <h1>Menú diario</h1>

  <div class="mb-3">
    <label class="form-label">Nombre del alimento</label>
    <input type="text" class="form-control" [(ngModel)]="nombre" placeholder="Ejemplo: Manzana" />
  </div>

  <div class="mb-3">
    <label class="form-label">Calorías</label>
    <input type="number" class="form-control" [(ngModel)]="calorias" placeholder="Ejemplo: 52" />
  </div>

  <button class="btn btn-primary" (click)="agregarAlimento()">Añadir al menú</button>

  <h2 [class.text-danger]="totalCalorias > 2000">Calorías Totales: {{ totalCalorias }}</h2>

  <ul class="list-group mt-3">
    @for (alimento of alimentos; track alimento.nombre) {
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span> {{ alimento.nombre }} - {{ alimento.calorias }} kcal </span>

        <button class="btn btn-danger btn-sm" (click)="eliminarAlimento(alimento)">Eliminar</button>
      </li>
    }
  </ul>
</div>
