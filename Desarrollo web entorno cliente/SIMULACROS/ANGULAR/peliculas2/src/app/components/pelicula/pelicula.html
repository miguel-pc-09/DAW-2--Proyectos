<div class="container">
  <div class="row row-cols-4 row-cols-md-4 g-4">
    @for (item of peliculas; track item.id) {
      <div class="col">
        <div class="card">
          <img [src]="item.posterURL" class="card-img-top" alt="..." />
          <div class="card-body">
            <h5 class="card-title">{{ item.title }}</h5>
            <p class="card-text">{{ item.imdbId }} y su id es {{ item.id }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</div>
