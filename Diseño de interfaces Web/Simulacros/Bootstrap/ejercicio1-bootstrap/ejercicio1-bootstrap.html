<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel estadísticas Bootstrap</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light min-vh-100 d-flex align-items-center">
    <main class="container">
      <div class="row justify-content-center g-4">
        <div class="col-12 col-md-4">
          <div
            class="card shadow-sm border-0 border-start border-5 border-primary"
          >
            <div class="card-body text-center p-4">
              <h3 class="fs-5 text-secondary">Usuarios</h3>
              <p class="display-5 fw-bold mb-1">1,234</p>
              <p class="text-secondary mb-0">Usuarios activos</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div
            class="card shadow-sm border-0 border-start border-5 border-success"
          >
            <div class="card-body text-center p-4">
              <h3 class="fs-5 text-secondary">Ventas</h3>
              <p class="display-5 fw-bold mb-1">567</p>
              <p class="text-secondary mb-0">Ventas hoy</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div
            class="card shadow-sm border-0 border-start border-5 border-warning"
          >
            <div class="card-body text-center p-4">
              <h3 class="fs-5 text-secondary">Visitas</h3>
              <p class="display-5 fw-bold mb-1">89K</p>
              <p class="text-secondary mb-0">Visitas totales</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
