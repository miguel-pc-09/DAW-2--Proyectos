<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Formulario Bootstrap</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-light min-vh-100 d-flex justify-content-center align-items-center"
  >
    <main
      class="card shadow border-0 rounded-4 p-4"
      style="max-width: 500px; width: 100%"
    >
      <div class="text-center mb-4">
        <h1 class="fw-bold">Crear cuenta</h1>
        <p class="text-secondary">Completa tus datos para registrarte</p>
      </div>

      <form>
        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label fw-bold">Nombre</label>
            <input
              type="text"
              class="form-control form-control-lg"
              placeholder="Juan"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label fw-bold">Apellido</label>
            <input
              type="text"
              class="form-control form-control-lg"
              placeholder="Pérez"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Correo electrónico</label>
          <input
            type="email"
            class="form-control form-control-lg"
            placeholder="ejemplo@correo.com"
          />
        </div>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <label class="form-label fw-bold">Contraseña</label>
            <input
              type="password"
              class="form-control form-control-lg"
              placeholder="••••••••"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label fw-bold">Confirmar contraseña</label>
            <input
              type="password"
              class="form-control form-control-lg"
              placeholder="••••••••"
            />
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terminos" />
          <label class="form-check-label" for="terminos">
            Acepto los términos y condiciones y la política de privacidad
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
          Registrarse
        </button>

        <p class="text-center text-secondary mt-4 mb-0">
          ¿Ya tienes cuenta?
          <a href="#" class="text-decoration-none fw-bold">Inicia sesión</a>
        </p>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
