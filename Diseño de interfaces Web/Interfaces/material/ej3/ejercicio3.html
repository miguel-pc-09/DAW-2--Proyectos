<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Formulario de Registro</title>
    <link rel="stylesheet" href="solucion3.css">
</head>
<body>
    <div class="form-card">
        <div class="form-header">
            <h1>Crear cuenta</h1>
            <p>Completa tus datos para registrarte</p>
        </div>

        <form>
            <!-- Fila nombre completo -->
            <div class="name-row">
                <div class="input-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Juan">
                </div>
                <div class="input-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Pérez">
                </div>
            </div>

            <!-- Email -->
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
            </div>

            <!-- Fila contraseñas -->
            <div class="password-row">
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" placeholder="••••••••">
                </div>
            </div>

            <!-- Términos y condiciones -->
            <div class="terms-row">
                <input type="checkbox" id="terms">
                <label for="terms">Acepto los términos y condiciones y la política de privacidad</label>
            </div>

            <!-- Botón -->
            <button type="submit" class="btn-register">Registrarse</button>

            <!-- Enlace -->
            <div class="login-link">
                <p>¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
            </div>
        </form>
    </div>
</body>
</html>
