<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="mt-4">
      <h1 class="text-center">Asociación de Animales</h1>

      <!-- NAVBAR -->
      <nav class="navbar navbar-expand-lg bg-dark mt-3">
        <div class="container justify-content-center">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link text-light" href="#">Mamíferos</a>
            </li>

            <li class="nav-item">
              <a class="nav-link text-light" href="#">Aves</a>
            </li>

            <li class="nav-item">
              <a class="nav-link text-light" href="#">Reptiles</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- TARJETAS -->
      <section class="container mt-5">
        <div class="row justify-content-center g-5">
          <!-- LEÓN -->
          <div class="col-12 col-md-4 text-center">
            <div class="card shadow-sm p-3">
              <img
                src="img/leon.jpg"
                alt="León"
                class="img-fluid mx-auto"
                style="width: 360px; height: 220px; object-fit: cover"
              />

              <h3 class="mt-2">León</h3>
            </div>
          </div>

          <!-- LORO -->
          <div class="col-12 col-md-4 text-center">
            <div class="card shadow-sm p-3">
              <img
                src="img/loro.png"
                alt="Loro"
                class="img-fluid mx-auto"
                style="width: 360px; height: 220px; object-fit: cover"
              />

              <h3 class="mt-2">Loro</h3>
            </div>
          </div>

          <!-- SERPIENTE -->
          <div class="col-12 col-md-4 text-center">
            <div class="card shadow-sm p-3">
              <img
                src="img/serpiente.jpg"
                alt="Serpiente"
                class="img-fluid mx-auto"
                style="width: 360px; height: 220px; object-fit: cover"
              />

              <h3 class="mt-2">Serpiente</h3>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
