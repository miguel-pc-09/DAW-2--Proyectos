<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asociación de Animales</title>
    <!-- Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>

    <!-- Título principal -->
    <h1 class="text-center mt-4 mb-3">Asociación de Animales</h1>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-dark bg-secondary">
      <div class="container-fluid justify-content-center">
        <ul class="navbar-nav flex-row gap-3">
          <li class="nav-item">
            <a class="nav-link text-white" href="#">Mamíferos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#">Aves</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#">Reptiles</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Galería de animales -->
    <div class="container mt-4">
      <div class="row g-4">

        <!-- Tarjeta León -->
        <div class="col-12 col-md-4">
          <div class="card border">
            <img
              src="leon.jpg"
              class="card-img-top"
              alt="León"
            />
            <div class="card-body text-center">
              <p class="card-text fw-semibold">León</p>
            </div>
          </div>
        </div>

        <!-- Tarjeta Loro -->
        <div class="col-12 col-md-4">
          <div class="card border">
            <img
              src="loro.jpg"
              class="card-img-top"
              alt="Loro"
            />
            <div class="card-body text-center">
              <p class="card-text fw-semibold">Loro</p>
            </div>
          </div>
        </div>

        <!-- Tarjeta Serpiente -->
        <div class="col-12 col-md-4">
          <div class="card border">
            <img
              src="serpiente.jpg"
              class="card-img-top"
              alt="Serpiente"
            />
            <div class="card-body text-center">
              <p class="card-text fw-semibold">Serpiente</p>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
